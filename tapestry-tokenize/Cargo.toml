[package]
name = "tapestry-tokenize"
version = "0.1.3"
authors = [
	"transkatgirl",
]
homepage = "https://github.com/transkatgirl/Tapestry-Loom"
license = "Unlicense"
description = "A server which provides a basic HTTP API for tokenizing and detokenizing inputs."
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = [
	"derive",
] }
toml = { version = "1.1.2", features = [
	"parse",
	"serde",
], default-features = false }
rocket = { version = "0.5.1", features = [
	"json",
	"tls",
	"mtls",
] }
anyhow = "1.0.102"
tokenizers = { version = "0.23.1", features = [
	"onig",
	"esaxx_fast",
], default-features = false }
log = { version = "0.4.32", features = [
	"release_max_level_debug",
] }
