[package]
name = "tapestry-loom"
version = "0.14.0"
authors = [
	"transkatgirl",
]
homepage = "https://github.com/transkatgirl/Tapestry-Loom"
license = "AGPL-3.0-or-later"
description = "A power user focused interface for LLM base models."
edition = "2024"

[package.metadata]
donate = "https://github.com/sponsors/transkatgirl"

[features]
donation-link = [  ]

[dependencies] # TODO: Cleanup & update dependencies
tapestry-weave = { path = "tapestry-weave", features = [
	"v1", # TODO: Add v0 feature after rewrite is finished? Or should we require using migration-assistant instead of automatically updating weaves?
], default-features = false }
eframe = { version = "0.34.3", features = [
	"accesskit",
	"persistence",
] }
env_logger = { version = "0.11.10", features = [
	"auto-color",
	"humantime",
] }
log = { version = "0.4.33", features = [
	"release_max_level_debug",
] }
mimalloc = "0.1.52"
serde = { version = "1.0.228", features = [
	"derive",
] }
serde_json = { version = "1.0.150", features = [
	"preserve_order",
	"arbitrary_precision",
] }
ron = { version = "0.12.2", features = [
	"indexmap",
	"integer128",
	"unicode-segmentation",
] }
reqwest = { version = "0.13.4", features = [
	"json",
	"gzip",
	"brotli",
	"zstd",
	"deflate",
] }
parking_lot = { version = "0.12.5", features = [
	"serde",
] }
anyhow = "1.0.102"
dirs-next = "2.0.0"
egui_tiles = "0.15.0"
egui-notify = "0.22.0"
tokio = { version = "1.52.3", features = [
	"full",
] }
futures = "0.3.32"
walkdir = "2.5.0"
unicode-segmentation = "1.13.3"
trash = "5.2.6"
poll-promise = { version = "0.3.0", features = [
	"tokio",
] }
ctrlc = "3.5.2"
chrono = "0.4.45"
egui-keybind = { git = "https://github.com/transkatgirl/egui-keybind.git", rev = "86a29afc7e083b33c8bbec7278da59a66226bd97", features = [
	"serde",
] }
flagset = { version = "0.4.7", features = [
	"std",
] }
bytes = "1.12.0"
font-kit = "0.14.3"
egui_solarized = "0.34.1"
egui_virtual_list = "0.10.0"
egui_plot = "0.35.0"
rust-sugiyama = "0.4.0"
ml-distance = "1.0.1"
elkai-rs = "0.1.7"
base64 = "0.22.1"
linked-hash-map = "0.5.6"
ulid = { version = "1.2.1", features = [
	"serde",
] }
egui_dnd = "0.15.0"
egui-probe = { version = "0.11.0", features = [
	"derive",
] }

[build-dependencies]
cargo_metadata = "0.23.1"

[profile.dev]
opt-level = 3

[profile.release]
strip = "symbols"
panic = "abort"

[workspace]
members = [
	"tapestry-weave",
	"migration-assistant",
	"tapestry-tokenize",
]
