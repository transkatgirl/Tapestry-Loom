[package]
name = "tapestry-loom-migration-assistant"
version = "0.5.0"
authors = [
	"transkatgirl",
]
homepage = "https://github.com/transkatgirl/Tapestry-Loom"
license = "Unlicense"
description = "A tool for converting weaves from other Loom implementations into the Tapestry Loom weave format."
edition = "2024"

[dependencies]
base64 = "0.23.1"
miniz_oxide = { version = "0.9.1", features = [
	"std",
] }
frontmatter = "0.4.0"
boa_engine = { version = "0.22.0", default-features = false }
tapestry-weave = { path = "../tapestry-weave", features = [
	"all_versions",
] }
clap = { version = "4.6.7", features = [
	"derive",
] }
anyhow = "1.0.104"
walkdir = "2.5.0"
serde = { version = "1.0.229", features = [
	"derive",
] }
serde_json = { version = "1.0.151", features = [
	"preserve_order",
	"float_roundtrip",
	"arbitrary_precision",
	"unbounded_depth",
] }
chrono = { version = "0.4.45", features = [
	"alloc",
	"std",
	"clock",
	"serde",
], default-features = false }
uuid = { version = "1.26.1", features = [
	"serde",
], default-features = false }
stacksafe = "1.0.3"
ulid = "3.0.0"
serde_stacker = "0.1.14"
